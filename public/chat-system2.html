<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Chat - System 2</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Roboto, sans-serif;
        background: #f3f4f6;
        color: #111827;
      }
      main {
        width: min(560px, calc(100% - 32px));
        padding: 32px;
        border-radius: 12px;
        background: #ffffff;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
      }
      h1 {
        margin: 0 0 16px;
        font-size: 1.8rem;
      }
      p {
        margin: 0 0 12px;
        line-height: 1.6;
      }
      .meta {
        margin: 20px 0;
        padding: 16px;
        border-radius: 8px;
        background: #eef2ff;
      }
      a {
        color: #2563eb;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>System 2 Placeholder</h1>
      <p>This page confirms that even Participant IDs are routed to the alternate system.</p>
      <div class="meta">
        <p><strong>Participant ID:</strong> <span id="participant-id">—</span></p>
        <p><strong>systemID:</strong> <span id="system-id">2</span></p>
      </div>
      <p>The baseline chat experience remains on system 1. This placeholder is only for routing verification.</p>
      <p><a href="/public">Return to participant entry</a></p>
    </main>
    <script>
      document.getElementById('participant-id').textContent = localStorage.getItem('participantID') || 'unknown';
      document.getElementById('system-id').textContent = new URLSearchParams(window.location.search).get('systemID') || '2';
    </script>
  </body>
</html>
