<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatBot</title>
    <meta name="description" content="A simple chatbot interface built with HTML, CSS, and JavaScript." />
    <link rel="stylesheet" href="style.css" />
    <style>
      .story-widgets {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        padding: 0.4rem 0.6rem 0.6rem;
        max-width: 75%;
      }

      .story-rating {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .rating-label {
        font-size: 0.8rem;
        color: #6b7280;
        white-space: nowrap;
      }

      .stars-container {
        display: flex;
        gap: 0.1rem;
      }

      .star-btn {
        background: none;
        border: none;
        padding: 0;
        font-size: 1.2rem;
        color: #f59e0b;
        cursor: pointer;
        line-height: 1;
        transition: transform 0.1s;
      }

      .star-btn:hover:not(:disabled) {
        transform: scale(1.25);
      }

      .star-btn:disabled {
        cursor: default;
        transform: none;
      }

      .story-actions {
        display: flex;
        gap: 0.4rem;
      }

      .story-action-btn {
        padding: 0.3rem 0.75rem;
        border: none;
        border-radius: 4px;
        font-size: 0.8rem;
        cursor: pointer;
        transition: background 0.15s;
      }

      .story-action-btn:disabled {
        opacity: 0.45;
        cursor: default;
      }

      .accept-btn  { background: #3B82F6; color: white; }
      .accept-btn:hover:not(:disabled)  { background: #2563eb; }

      .discard-btn { background: #ef4444; color: white; }
      .discard-btn:hover:not(:disabled) { background: #dc2626; }

      .regenerate-btn { background: #6b7280; color: white; }
      .regenerate-btn:hover:not(:disabled) { background: #4b5563; }

      .story-badge {
        display: inline-block;
        font-size: 0.75rem;
        font-weight: 700;
        padding: 0.2rem 0.55rem;
        border-radius: 10px;
        margin-top: 0.3rem;
      }

      .accepted-badge {
        background: #16a34a;
        color: white;
      }

      .discarded-badge {
        background: #9ca3af;
        color: white;
      }

      .regenerate-badge {
        background: #f59e0b;
        color: white;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;400;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="system-banner"></div>
    <script>
      (function() {
        const params = new URLSearchParams(window.location.search);
        const systemID = params.get('systemID');
        const banner = document.getElementById('system-banner');
        if (systemID === '2') {
          banner.textContent = 'System 2 — Enhanced';
          banner.style.cssText = 'background:#d1fae5;color:#065f46;text-align:center;padding:6px;font-size:0.85rem;font-family:Roboto,sans-serif;';
        } else {
          banner.textContent = 'System 1 — Baseline';
          banner.style.cssText = 'background:#dbeafe;color:#1e3a5f;text-align:center;padding:6px;font-size:0.85rem;font-family:Roboto,sans-serif;';
        }
      })();
    </script>
    <main>
      <div id="doc-panel" class="container">
        <h2>Document Management</h2>
        <hr/>
        <form id="upload-form">
          <h3>Upload Document</h3>
          <input type="file" id="file-input" />
          <button id="upload-btn">Upload</button>
        </form>
        <section id="documents-section">
          <h3>Uploaded Documents</h3>
          <ul id="uploaded-docs">No documents uploaded yet</ul>
        </section>
        <section id="retrieval-method">
          <h3>Retrieval Method</h3>
          <select id="retrieval-select">
            <option value="semantic">Semantic (Embeddings)</option>
            <option value="tfidf">TF-IDF (Keyword)</option>
          </select>
        </section>
        <section id="evidence-section">
          <h3>Retrieved Evidence</h3>
          <p id="confidence-display">Confidence: —</p>
          <ul id="evidence-list"></ul>
        </section>
      </div>
      <div id="chat-container" class="container">
        <h1>AI Chat</h1>
        <hr/>
        <div id="messages"></div>
        <div id="input-area">
          <input type="text" id="user-input" placeholder="Begin chatting..." />
          <button id="send-btn">Send</button>
        </div>
      </div>
    </main>
    <script src="/marked.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
