<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Story Teller — System 2</title>
    <meta name="description" content="AI Story Teller chatbot interface." />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;400;700&display=swap" rel="stylesheet">
    <style>
      #system-banner {
        background: #d1fae5;
        color: #065f46;
        text-align: center;
        padding: 6px;
        font-size: 0.85rem;
        font-family: Roboto, sans-serif;
      }

      /* Story Settings section */
      #story-settings {
        border: 1px solid #6ee7b7;
        background-color: #f0fdf4;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        padding: 0.75rem;
        border-radius: 4px;
      }

      #story-settings h3 {
        color: #065f46;
        margin-bottom: 0.25rem;
      }

      .setting-row {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
      }

      .setting-row > label {
        font-size: 0.85rem;
        font-weight: 700;
        color: #374151;
      }

      .slider-row {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .slider-label {
        font-size: 0.8rem;
        font-weight: 700;
        color: #1e3a5f;
        min-width: 12px;
        text-align: center;
      }

      .slider-row input[type="range"] {
        flex: 1;
        accent-color: #3B82F6;
        cursor: pointer;
        height: 4px;
      }

      .slider-value {
        font-size: 0.75rem;
        color: #6b7280;
        min-width: 48px;
        text-align: right;
      }

      /* Theme button + tag */
      #theme-btn {
        width: 100%;
        background: white;
        color: #374151;
        border: 1px solid #6ee7b7;
        border-radius: 4px;
        padding: 0.35rem 0.6rem;
        font-size: 0.875rem;
        text-align: left;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      #theme-btn:hover { background: #f0fdf4; }
      #theme-btn-arrow { color: #6b7280; font-size: 0.7rem; }

      #active-theme-tag {
        display: none;
        font-size: 0.78rem;
        background: #dbeafe;
        color: #1e3a5f;
        border-radius: 12px;
        padding: 2px 10px;
        align-self: flex-start;
        margin-top: 2px;
      }

      /* Theme dialog */
      #theme-dialog {
        border: none;
        border-radius: 8px;
        padding: 1.25rem;
        width: 300px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.18);
        font-family: Roboto, sans-serif;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        margin: 0;
      }
      #theme-dialog::backdrop {
        background: rgba(0,0,0,0.35);
      }
      #theme-dialog h4 {
        margin: 0 0 0.75rem;
        font-size: 1rem;
        color: #1e3a5f;
      }
      .theme-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        margin-bottom: 0.75rem;
      }
      .theme-chip {
        padding: 0.3rem 0.75rem;
        border-radius: 16px;
        border: 1.5px solid #93c5fd;
        background: white;
        color: #1e3a5f;
        font-size: 0.82rem;
        cursor: pointer;
        transition: background 0.15s, color 0.15s;
      }
      .theme-chip.selected {
        background: #3B82F6;
        color: white;
        border-color: #3B82F6;
      }
      #theme-dialog label {
        font-size: 0.8rem;
        color: #6b7280;
        display: block;
        margin-bottom: 0.3rem;
      }
      #theme-custom-input {
        width: 100%;
        padding: 0.35rem 0.5rem;
        border: 1px solid #d1d5db;
        border-radius: 4px;
        font-size: 0.875rem;
        margin-bottom: 0.75rem;
        box-sizing: border-box;
      }
      .theme-dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 0.5rem;
      }
      #theme-cancel-btn {
        background: #e5e7eb;
        color: #374151;
        padding: 0.35rem 0.9rem;
        font-size: 0.85rem;
      }
      #theme-confirm-btn {
        background: #3B82F6;
        padding: 0.35rem 0.9rem;
        font-size: 0.85rem;
      }

      /* Override send button color for system 2 */
      #send-btn {
        background-color: #16a34a;
      }
      #send-btn:hover {
        background-color: #15803d;
      }
    </style>
  </head>
  <body>
    <div id="system-banner">AI Story Teller — System 2</div>
    <main>
      <div id="doc-panel" class="container">
        <h2>Settings</h2>
        <hr/>

        <!-- Story Settings -->
        <section id="story-settings">
          <h3>Story Settings</h3>

          <div class="setting-row">
            <label for="read-level-slider">Read Level</label>
            <div class="slider-row">
              <span class="slider-label">E</span>
              <input type="range" id="read-level-slider" min="1" max="5" value="3" />
              <span class="slider-label">H</span>
            </div>
            <span class="slider-value" id="read-level-label">Medium</span>
          </div>

          <div class="setting-row">
            <label for="sentence-length-slider">Max Words / Sentence</label>
            <div class="slider-row">
              <span class="slider-label">5</span>
              <input type="range" id="sentence-length-slider" min="5" max="40" step="5" value="20" />
              <span class="slider-label">40</span>
            </div>
            <span class="slider-value" id="sentence-length-label">20 words</span>
          </div>

          <div class="setting-row">
            <label>Theme</label>
            <button type="button" id="theme-btn">
              <span id="theme-btn-text">Choose themes...</span>
              <span id="theme-btn-arrow">▼</span>
            </button>
            <span id="active-theme-tag"></span>
          </div>
        </section>

        <!-- Theme picker dialog -->
        <dialog id="theme-dialog">
          <h4>Choose Themes</h4>
          <div class="theme-chips">
            <button type="button" class="theme-chip" data-theme="princess">Princess</button>
            <button type="button" class="theme-chip" data-theme="dragon">Dragon</button>
            <button type="button" class="theme-chip" data-theme="adventure">Adventure</button>
            <button type="button" class="theme-chip" data-theme="space">Space</button>
            <button type="button" class="theme-chip" data-theme="mystery">Mystery</button>
            <button type="button" class="theme-chip" data-theme="fantasy">Fantasy</button>
            <button type="button" class="theme-chip" data-theme="friendship">Friendship</button>
            <button type="button" class="theme-chip" data-theme="magic">Magic</button>
          </div>
          <label for="theme-custom-input">Custom (comma-separated)</label>
          <input type="text" id="theme-custom-input" placeholder="e.g. robot, time travel" />
          <div class="theme-dialog-actions">
            <button type="button" id="theme-cancel-btn">Cancel</button>
            <button type="button" id="theme-confirm-btn">OK</button>
          </div>
        </dialog>

        <!-- Document Upload -->
        <form id="upload-form">
          <h3>Upload Document</h3>
          <input type="file" id="file-input" />
          <button id="upload-btn">Upload</button>
        </form>

        <section id="documents-section">
          <h3>Uploaded Documents</h3>
          <ul id="uploaded-docs">No documents uploaded yet</ul>
        </section>

        <section id="retrieval-method">
          <h3>Retrieval Method</h3>
          <select id="retrieval-select">
            <option value="semantic">Semantic (Embeddings)</option>
            <option value="tfidf">TF-IDF (Keyword)</option>
          </select>
        </section>

        <section id="evidence-section">
          <h3>Retrieved Evidence</h3>
          <p id="confidence-display">Confidence: —</p>
          <ul id="evidence-list"></ul>
        </section>
      </div>

      <div id="chat-container" class="container">
        <h1>AI Story Teller</h1>
        <hr/>
        <div id="messages"></div>
        <div id="input-area">
          <input type="text" id="user-input" placeholder="Describe the story you want..." />
          <button id="send-btn">Generate</button>
        </div>
      </div>
    </main>

    <script>
      // Inject systemID=2 into URL params
      (function () {
        const params = new URLSearchParams(window.location.search);
        if (!params.has('systemID')) {
          params.set('systemID', '2');
          window.history.replaceState(null, '', window.location.pathname + '?' + params.toString());
        }
      })();

      // Slider label helpers
      function readLevelLabel(v) {
        if (v <= 2) return 'Easy';
        if (v === 3) return 'Medium';
        return 'Hard';
      }
      function sentenceLengthLabel(v) {
        return `${v} words`;
      }

      const readSlider = document.getElementById('read-level-slider');
      const sentenceSlider = document.getElementById('sentence-length-slider');
      const readLabel = document.getElementById('read-level-label');
      const sentenceLabel = document.getElementById('sentence-length-label');

      readSlider.addEventListener('input', () => {
        readLabel.textContent = readLevelLabel(parseInt(readSlider.value));
      });
      sentenceSlider.addEventListener('input', () => {
        sentenceLabel.textContent = sentenceLengthLabel(parseInt(sentenceSlider.value));
      });

      // Theme dialog
      const themeDialog = document.getElementById('theme-dialog');
      const themeBtnEl = document.getElementById('theme-btn');
      const themeBtnText = document.getElementById('theme-btn-text');
      const activeThemeTag = document.getElementById('active-theme-tag');
      const themeCustomInput = document.getElementById('theme-custom-input');
      const themeConfirmBtn = document.getElementById('theme-confirm-btn');
      const themeCancelBtn = document.getElementById('theme-cancel-btn');
      const themeChips = document.querySelectorAll('.theme-chip');

      let selectedThemes = new Set();

      themeBtnEl.addEventListener('click', () => themeDialog.showModal());

      themeChips.forEach(chip => {
        chip.addEventListener('click', () => {
          const t = chip.dataset.theme;
          if (selectedThemes.has(t)) {
            selectedThemes.delete(t);
            chip.classList.remove('selected');
          } else {
            selectedThemes.add(t);
            chip.classList.add('selected');
          }
        });
      });

      themeConfirmBtn.addEventListener('click', () => {
        const customVal = themeCustomInput.value.trim();
        const allThemes = [...selectedThemes];
        if (customVal) allThemes.push(...customVal.split(',').map(s => s.trim()).filter(Boolean));

        if (allThemes.length > 0) {
          const label = allThemes.join(', ');
          themeBtnText.textContent = label;
          activeThemeTag.textContent = label;
          activeThemeTag.style.display = 'inline-block';
        } else {
          themeBtnText.textContent = 'Choose themes...';
          activeThemeTag.style.display = 'none';
        }
        themeDialog.close();
      });

      themeCancelBtn.addEventListener('click', () => themeDialog.close());

      // Expose getter for script2.js
      window.getStorySettings = function () {
        const readVal = parseInt(readSlider.value);
        const sentenceVal = parseInt(sentenceSlider.value);

        const customVal = themeCustomInput.value.trim();
        const allThemes = [...selectedThemes];
        if (customVal) allThemes.push(...customVal.split(',').map(s => s.trim()).filter(Boolean));
        const themeVal = allThemes.length > 0 ? allThemes.join(', ') : '';

        return {
          readLevel: readLevelLabel(readVal).toLowerCase(),
          sentenceLength: sentenceVal,
          theme: themeVal
        };
      };
    </script>

    <script src="/marked.min.js"></script>
    <script src="script2.js"></script>
  </body>
</html>
